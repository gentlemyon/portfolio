
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Портфолио | Кинооператор</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #202020;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
    .fallback {
      position: absolute;
      bottom: 16px;
      right: 16px;
      padding: 10px 14px;
      background: #fff;
      color: #111;
      border-radius: 6px;
      font: 14px Arial, sans-serif;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <iframe
    src="./portfolio.pdf"
    title="Портфолио"
  ></iframe>
  <a class="fallback" href="./portfolio.pdf">
    Открыть PDF
  </a>
</body>
</html>
